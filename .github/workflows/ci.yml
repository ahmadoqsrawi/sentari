name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install (core: standard library only)"
        run: pip install .

      - name: Byte-compile
        run: python -m compileall -q sentari tests

      - name: Import smoke
        run: python -c "import sentari; from sentari.cli import main; print('import ok')"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: "CLI smoke: list phases"
        run: python -m sentari --list-phases

      - name: "CLI smoke: refuses unauthorized target"
        run: |
          if python -m sentari example.com; then
            echo "ERROR: ran without scope/authorization"; exit 1
          else
            echo "correctly refused unauthorized/out-of-scope target"
          fi
