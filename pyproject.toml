[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentari"
version = "0.8.0"
description = "Evidence-grounded, authorized security assessment orchestrator"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Ahmad", email = "contact@ahmadoqsrawi.com" }]
keywords = ["security", "pentest", "reconnaissance", "authorized-testing"]
dependencies = []  # core runs on the standard library only

[project.optional-dependencies]
ai = ["openai>=1.3", "anthropic>=0.39"]
distributed = ["celery>=5", "redis>=5"]
postgres = ["psycopg2-binary>=2.9"]
pdf = ["reportlab>=4"]
cloud = ["boto3>=1.28", "azure-identity>=1.15", "azure-mgmt-compute>=30",
         "azure-mgmt-network>=25", "google-cloud-compute>=1.14"]
openvas = ["python-gvm>=23"]
privesc = ["paramiko>=3"]
api = ["pyyaml>=6"]
browser = ["playwright>=1.40"]
sast = ["semgrep>=1.50"]
proxy = ["mitmproxy>=10"]
dev = ["pytest>=7"]

[project.scripts]
sentari = "sentari.cli:main"

[tool.setuptools.packages.find]
include = ["sentari*"]
