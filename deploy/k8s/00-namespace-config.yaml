apiVersion: v1
kind: Namespace
metadata:
  name: sentari
---
# Example secret: change the values before applying in any real environment.
apiVersion: v1
kind: Secret
metadata:
  name: sentari-config
  namespace: sentari
type: Opaque
stringData:
  SENTARI_BROKER_URL: "redis://redis:6379/0"
  SENTARI_RESULT_BACKEND: "redis://redis:6379/0"
  SENTARI_DB: "postgresql://sentari:change-me@postgres:5432/sentari"
  POSTGRES_USER: "sentari"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "sentari"
