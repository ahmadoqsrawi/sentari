apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentari-dashboard
  namespace: sentari
spec:
  replicas: 1
  selector:
    matchLabels: { app: sentari-dashboard }
  template:
    metadata:
      labels: { app: sentari-dashboard }
    spec:
      containers:
        - name: dashboard
          image: sentari:latest
          imagePullPolicy: IfNotPresent
          # read-only dashboard; binds 0.0.0.0 inside the pod (Service fronts it)
          command: ["--serve", "--db", "$(SENTARI_DB)", "--host", "0.0.0.0", "--port", "8600"]
          envFrom:
            - secretRef: { name: sentari-config }
          ports:
            - containerPort: 8600
          readinessProbe:
            httpGet: { path: /, port: 8600 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentari-dashboard
  namespace: sentari
spec:
  type: ClusterIP            # front with an Ingress; keep it internal by default
  selector: { app: sentari-dashboard }
  ports:
    - port: 80
      targetPort: 8600
