# Sentari stack: the multi-tenant platform API, Celery workers, a shared OOB
# collaborator, Redis, and the read-only dashboard. The image (see Dockerfile)
# ships every scanner, so a containerized run has the full tool set, no host
# setup.
#
# Bring it up:   docker compose up --build
# Create a user: docker compose run --rm platform-api api-user add you@example.com \
#                  --db /data/sentari-platform.db
# Then POST scans to http://localhost:8700/api/scans with the printed Bearer token.
#
# OOB callbacks (SSRF/XXE/command injection) from EXTERNAL targets must reach the
# collaborator at a public URL. Set SENTARI_OOB_PUBLIC_URL in .env to
# http://<your-public-host-or-ip>:8611 and open that port in the host firewall and
# your cloud security group. If unset, scans use a local listener (localhost only).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  oob:
    build: .
    restart: unless-stopped
    command: ["serve-oob", "--host", "0.0.0.0", "--port", "8611"]
    ports:
      - "8611:8611"   # shared OOB collaborator; open this port to the internet

  platform-api:
    build: .
    restart: unless-stopped
    command: ["serve-api", "--celery", "--db", "/data/sentari-platform.db",
              "--host", "0.0.0.0", "--port", "8700"]
    environment:
      SENTARI_BROKER_URL: redis://redis:6379/0
      SENTARI_OOB_SERVICE: ${SENTARI_OOB_PUBLIC_URL:-}
    ports:
      - "8700:8700"
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    entrypoint: ["celery", "-A", "sentari.tasks", "worker", "--loglevel=info"]
    environment:
      SENTARI_BROKER_URL: redis://redis:6379/0
      SENTARI_OOB_SERVICE: ${SENTARI_OOB_PUBLIC_URL:-}
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    build: .
    restart: unless-stopped
    command: ["--serve", "--db", "/data/sentari.db", "--host", "0.0.0.0", "--port", "8600"]
    ports:
      - "8600:8600"
    volumes:
      - data:/data
    depends_on:
      - redis

  # helper for enqueuing dashboard-style scans (same image, default entrypoint)
  worker-cli:
    build: .
    profiles: ["cli"]
    environment:
      SENTARI_BROKER_URL: redis://redis:6379/0
    volumes:
      - data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  data:
